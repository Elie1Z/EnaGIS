name: Contracts, data spine, pipeline and experiments

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          python-version: "3.12.14"
      - name: Install pinned dependencies
        run: make setup
      - name: Validate contracts, data, pipeline and experiment fixtures offline
        env:
          PROJ_NETWORK: "OFF"
        run: make check
