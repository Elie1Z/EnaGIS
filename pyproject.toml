[project]
name = "enagis"
version = "0.1.0"
description = "Evidence-preserving agricultural energy screening contracts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12,<3",
    "pyproj>=3.7.2,<3.8",
    "shapely>=2.1.2,<2.2",
    "pypdf>=6.1,<7",
    "scikit-learn>=1.7,<1.10",
    "scipy>=1.16,<2",
]

[project.scripts]
enagis = "enagis.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_cache/tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
